{% load static %}

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>
    <div class="page-container">

        <header class="form-page-header">
            <div>
                <h1>{{ title }}</h1>
                <p class="review-subtitle">
                    填寫客服案件資訊，建立後可進行案件評估與風險分流
                </p>
            </div>

            <a
                class="secondary-button"
                href="{% url 'ticket_list' %}"
            >
                返回案件列表
            </a>
        </header>

        <section class="form-card">

            <form
                method="post"
                class="ticket-form"
            >
                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">
                    <button
                        class="action-button"
                        type="submit"
                    >
                        {{ button_text }}
                    </button>

                    <a
                        class="secondary-button"
                        href="{% url 'ticket_list' %}"
                    >
                        取消
                    </a>
                </div>

            </form>

        </section>

    </div>
</body>

</html>
